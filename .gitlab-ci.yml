stages: [ build, test, deploy ]
default:
  before_script:
    - docker info

workflow:
  auto_cancel:
    on_job_failure: all

build:
  stage: build
  script:
    - docker build -t hfd:latest .
  tags:
    - build & test
  environment:
    name: build

first_test:
  stage: test
  script:
    - sleep 1
  tags:
    - build & test
  environment:
    name: test

second_test:
  stage: test
  script:
    - sleep 1
  tags:
    - build & test
  environment:
    name: test