stages: [ build, test, deploy ]
default:
  before_script:
    - docker info

workflow:
  auto_cancel:
    on_job_failure: all

build:
  stage: build
  script:
    - echo $APPSETTINGS > $APPSETTINGS_PATH
    - docker login -u $CI_USER -p $GITLAB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  tags:
    - build & test
  environment:
    name: build & test

first_test:
  stage: test
  script:
    - sleep 1
  tags:
    - build & test
  environment:
    name: build & test

second_test:
  stage: test
  script:
    - sleep 1
  tags:
    - build & test
  environment:
    name: build & test

deploy:
  only:
    - master
  stage: deploy
  variables:
    SERVICE_PORT_INTERNAL: 8080
  script:
    - docker login -u $CI_USER -p $GITLAB_TOKEN $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker stop $CI_PROJECT_NAME
    - docker rm $CI_PROJECT_NAME
    - docker run -d -it -v /etc/localtime:/etc/localtime:ro -e TZ=Europe/Moscow -p $SERVICE_PORT:$SERVICE_PORT_INTERNAL --name $CI_PROJECT_NAME $DOCKER_ARGS --restart=always $IMAGE_TAG
  tags:
    - deploy