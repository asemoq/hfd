stages: [ build, test, deploy ]
default:
    before_script:
        - docker info

workflow:
    auto_cancel:
        on_job_failure: all

build:
    stage: build
    script:
        - docker build --no-cache -t hfd:latest .
    environment:
        name: build

qodana:
  image:
    name: jetbrains/qodana-cdnet:2024.3-eap
    entrypoint: [""]
  cache:
    - key: qodana-2024.3-$CI_DEFAULT_BRANCH-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - qodana-2024.3-$CI_DEFAULT_BRANCH-
        - qodana-2024.3-
      paths:
        - .qodana/cache
  variables:
    QODANA_TOKEN: $QODANA_TOKEN
    QODANA_ENDPOINT: "https://qodana.cloud"
  tags: [test]
  script:
    - qodana --cache-dir=$CI_PROJECT_DIR/.qodana/cache
  artifacts:
    paths:
      - qodana/report/
    expose_as: 'Qodana report'

deploy:
    stage: deploy
    script:
        - docker rm -f hfd || true
        - docker run -d -it -v /etc/localtime:/etc/localtime:ro -e TZ=Europe/Moscow -e "ASPNETCORE_ENVIRONMENT=Development" -p 8080  --name hfd --network hfd --ip 172.18.0.4 --restart=always hfd:latest
        - docker image prune -a -f