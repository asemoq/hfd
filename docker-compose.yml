services:
  backend:
    container_name: ${PROJ_NAME}
    build: .
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: [ 8080 ]
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJ_NAME}.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.${PROJ_NAME}.entrypoints=web'
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend-data:/https:ro
    networks:
      hfd:
        ipv4_address: 172.18.0.4
  database:
    container_name: ${PROJ_NAME}-db
    image: postgres:12
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - 5432
    networks:
      hfd:
        ipv4_address: 172.18.0.5
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports: [ 80 ]
    networks:
      hfd:
        ipv4_address: 172.18.0.6
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PG_PROJ_NAME}.rule=Host(`${PG_DOMAIN}`)'
      - 'traefik.http.routers.${PG_PROJ_NAME}.entrypoints=web'

networks:
  hfd:
    external: true
volumes:
  backend-data:
  db-data:
  pgadmin-data:

